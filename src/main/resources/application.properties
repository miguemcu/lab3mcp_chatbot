spring.application.name=labmcp

# --- Servidor MCP (Spring AI) ---
spring.ai.mcp.server.name=labmcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

server.port=8088

# --- Logs ---
logging.file.name=./logs/labmcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG

# --- MySQL (la clave se lee de la variable de entorno PWD_UDEA) ---
spring.datasource.url=jdbc:mysql://localhost:3306/labmcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
